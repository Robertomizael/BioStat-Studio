name: Compilar instaladores

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win
            artifact: BioStat-Studio-Windows-x64
            files: dist/*.exe
          - os: macos-13
            command: npm run dist:mac:x64
            artifact: BioStat-Studio-macOS-Intel
            files: dist/*.dmg
          - os: macos-14
            command: npm run dist:mac:arm64
            artifact: BioStat-Studio-macOS-Apple-Silicon
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias del importador
        run: python -m pip install -r requirements-importer.txt
      - name: Compilar motor ReadStat
        shell: bash
        run: |
          rm -rf dist-importer build-importer
          python -m PyInstaller --onefile --clean --name biostat-importer --distpath dist-importer --workpath build-importer importer.py
      - run: npm install
      - run: npm run check
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
