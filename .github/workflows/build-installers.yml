name: Build BioStat Studio installers

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: powershell -ExecutionPolicy Bypass -File build/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BioStat-Studio-Windows
          path: |
            dist/BioStat Studio/**
            dist/BioStat_Studio_Windows_Portable.zip

  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash build/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BioStat-Studio-macOS-Apple-Silicon
          path: dist/BioStat_Studio_macOS.dmg

  macos-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash build/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BioStat-Studio-macOS-Intel
          path: dist/BioStat_Studio_macOS.dmg
