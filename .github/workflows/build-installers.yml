name: Compilar instaladores

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win
            artifact: BioStat-Studio-Windows-x64
            files: dist/*.exe
          - os: macos-13
            command: npm run dist:mac:x64
            artifact: BioStat-Studio-macOS-Intel
            files: dist/*.dmg
          - os: macos-14
            command: npm run dist:mac:arm64
            artifact: BioStat-Studio-macOS-Apple-Silicon
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias Python del importador
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-importer.txt
        shell: bash

      - name: Compilar motor de importación ReadStat
        shell: bash
        run: |
          rm -rf dist-importer build-importer
          python -m PyInstaller --onefile --clean --name biostat-importer --distpath dist-importer --workpath build-importer importer.py
          echo "Contenido del motor compilado:"
          ls -la dist-importer

      - name: Instalar dependencias de BioStat Studio
        run: npm install --no-audit --no-fund

      - name: Verificar JavaScript principal
        run: npm run check

      - name: Compilar instalador
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Mostrar instaladores generados
        shell: bash
        run: |
          echo "Contenido de dist:"
          find dist -maxdepth 2 -type f -print || true

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
